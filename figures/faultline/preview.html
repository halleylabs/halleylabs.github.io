<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fault line jig</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(560px,100% - 32px);margin:64px auto 96px}

`;

const DATA = {"P":{"origin":[238.1014933721779,185.63577169093537],"scale":1.06129746888602,"azimuth":45,"elevation":30},"REST":[0,-21.5,12.4],"BEAM":{"z":52,"top":60,"from":-46,"to":38,"slide":6.5},"SW_IDS":["s1","s2","s3"]};
const P = DATA.P;
// faultline, the truth behind the figure.
// Numbers from src/data/projects/faultline.json (README pilot): where a rule covered the
// tempting import, agents crossed it 3 of 6 times with no guidance, 5 of 6 with the rule in
// AGENTS.md, and 0 of 6 with faultline.
// The jig: a tray split by fences into six bays (the declared systems). A pick-and-place arm
// carries a part (an import) from bay to bay. Fences you marked as fault lines carry a
// limit-switch flag; a move that would cross one trips the flag and the arm stops short.

const ATTEMPTS = 6;
const SHIPPED_WITH = 0;
const SHIPPED_WITHOUT = 3;
const SHIPPED_RULE_IN_AGENTS_MD = 5;

// Bays (systems), floor centres in world units.
const BAYS = {
  BL: [-65, -21.5],
  BM: [0, -21.5],
  BR: [65, -21.5],
  FL: [-65, 21.5],
  FM: [0, 21.5],
  FR: [65, 21.5],
};
const HOME = "BM";

// Fault lines: a limit switch on a fence, at the point a move between two bays crosses it.
// `travel` is the axis of the move it blocks.
const SWITCHES = [
  { id: "s1", at: [33, -21.5], travel: "x" },
  { id: "s2", at: [-65, 0], travel: "y" },
  { id: "s3", at: [33, 21.5], travel: "x" },
];
// Plain fences (crossable): y fences at x = -33, 33 and the x fence at y = 0.

// Heights.
const PAD_TOP = 12.4; // a part set down on a bay's nest
const CARRY = 20; // part bottom while it travels, above every fence (top 11)
const PIVOT_Z = 17.3; // flag pivot on the switch body
const CONTACT_H = 24 - PIVOT_Z; // where the part's side meets the flag, above the pivot

// The head's leading extents (part radius in x, finger outside in y) and the flag's half thickness.
const LEAD = { x: 5, y: 7.4 };
const FLAG_HALF = 0.6;
const PUSH = 1.6; // how far past first touch the arm moves before the switch opens the circuit

// The tour: twelve moves from bay to bay, six of them forbidden.
const TOUR = [
  ["BM", "BR"],
  ["BM", "BL"],
  ["BL", "FL"],
  ["BL", "BR"],
  ["BL", "BM"],
  ["BM", "FM"],
  ["FM", "FR"],
  ["FM", "FL"],
  ["FL", "FR"],
  ["FL", "FM"],
  ["FM", "BM"],
  ["BM", "FL"],
];
// The one calm motion a site card plays on hover.
const HOVER_MOVE = ["BM", "BR"];

// A route moves along x first, then along y. It stops at the first fault line it would cross.
function route(from, to) {
  const [x0, y0] = BAYS[from];
  const [x1, y1] = BAYS[to];
  const legs = [
    { axis: "x", fixed: y0, a: x0, b: x1 },
    { axis: "y", fixed: x1, a: y0, b: y1 },
  ].filter((leg) => leg.a !== leg.b);
  const points = [[x0, y0]];
  for (const leg of legs) {
    const dir = Math.sign(leg.b - leg.a);
    const hit = SWITCHES.filter((s) => {
      if (s.travel !== leg.axis) return false;
      const along = leg.axis === "x" ? s.at[0] : s.at[1];
      const across = leg.axis === "x" ? s.at[1] : s.at[0];
      return Math.abs(across - leg.fixed) < 1e-6 && (along - leg.a) * dir > 0 && (leg.b - along) * dir > 0;
    }).sort((p, q) => Math.abs((leg.axis === "x" ? p.at[0] : p.at[1]) - leg.a) - Math.abs((leg.axis === "x" ? q.at[0] : q.at[1]) - leg.a))[0];
    if (hit) {
      const along = leg.axis === "x" ? hit.at[0] : hit.at[1];
      const touch = along - dir * (FLAG_HALF + LEAD[leg.axis]);
      const point = leg.axis === "x" ? [touch, leg.fixed] : [leg.fixed, touch];
      points.push(point);
      return { from, to, points, stop: { id: hit.id, axis: leg.axis, dir, touch } };
    }
    points.push(leg.axis === "x" ? [leg.b, leg.fixed] : [leg.fixed, leg.b]);
  }
  return { from, to, points, stop: null };
}

// Timing (seconds). Travel uses a smoothstep per leg.
const LIFT = 0.5;
const SET = 0.5;
const DWELL = 0.55;
const HOLD = 0.7;
const travelTime = (distance) => 0.45 + distance / 62;

// A move as a list of segments, each from one pose [x, y, z] to the next.
function timeline(move) {
  const r = route(move[0], move[1]);
  const segs = [];
  const add = (to, dur, tag) => {
    const from = segs.length ? segs[segs.length - 1].to : [r.points[0][0], r.points[0][1], PAD_TOP];
    segs.push({ from, to, dur, tag });
  };
  const [sx, sy] = r.points[0];
  add([sx, sy, CARRY], LIFT, "lift");
  for (let i = 1; i < r.points.length; i++) {
    const [x, y] = r.points[i];
    const [px, py] = r.points[i - 1];
    add([x, y, CARRY], travelTime(Math.hypot(x - px, y - py)), "travel");
  }
  if (r.stop) {
    const last = r.points[r.points.length - 1];
    const pushed = r.stop.axis === "x" ? [last[0] + r.stop.dir * PUSH, last[1]] : [last[0], last[1] + r.stop.dir * PUSH];
    add([pushed[0], pushed[1], CARRY], 0.32, "trip");
    add([pushed[0], pushed[1], CARRY], HOLD, "hold");
    for (let i = r.points.length - 1; i >= 0; i--) {
      const [x, y] = r.points[i];
      const prev = segs[segs.length - 1].to;
      add([x, y, CARRY], i === r.points.length - 1 ? 0.35 : travelTime(Math.hypot(x - prev[0], y - prev[1])), "back");
    }
    add([sx, sy, PAD_TOP], SET, "set");
  } else {
    const [ex, ey] = r.points[r.points.length - 1];
    add([ex, ey, PAD_TOP], SET, "set");
  }
  add(segs[segs.length - 1].to, DWELL, "dwell");
  const total = segs.reduce((sum, seg) => sum + seg.dur, 0);
  return { route: r, segs, total, ends: r.stop ? move[0] : move[1] };
}

const smooth = (t) => {
  const u = Math.min(1, Math.max(0, t));
  return u * u * (3 - 2 * u);
};

// The head's pose at time t into a move: [x, y, z] and the segment tag.
function poseAt(line, t) {
  let at = 0;
  for (const seg of line.segs) {
    if (t <= at + seg.dur) {
      const k = smooth((t - at) / seg.dur);
      return { pose: seg.from.map((v, i) => v + (seg.to[i] - v) * k), tag: seg.tag };
    }
    at += seg.dur;
  }
  const last = line.segs[line.segs.length - 1];
  return { pose: last.to.slice(), tag: "rest" };
}

// How far the head's leading face has pushed past a flag's rest face, and the flag angle that
// follows from it (the flag pivots, the part's side touches it CONTACT_H above the pivot).
function pushOn(sw, pose) {
  const across = sw.travel === "x" ? Math.abs(pose[1] - sw.at[1]) : Math.abs(pose[0] - sw.at[0]);
  if (across > 4 || pose[2] < CARRY - 4) return 0;
  const along = sw.travel === "x" ? pose[0] - sw.at[0] : pose[1] - sw.at[1];
  const reach = FLAG_HALF + LEAD[sw.travel];
  const pressed = reach - Math.abs(along);
  if (pressed <= 0) return 0;
  return -Math.sign(along) * Math.asin(Math.min(0.5, pressed / CONTACT_H));
}

// Readout words, from the same model as the motion.
function readoutOf(index, phase) {
  if (index < 0) return `${SHIPPED_WITH} of ${ATTEMPTS} forbidden shipped`;
  const move = TOUR[index];
  const forbidden = route(move[0], move[1]).stop;
  if (!forbidden) return phase === "set" || phase === "dwell" ? "allowed · placed" : "allowed · moving";
  const nth = TOUR.slice(0, index + 1).filter((m) => route(m[0], m[1]).stop).length;
  if (phase === "lift" || phase === "travel") return `forbidden ${nth} of ${ATTEMPTS} · moving`;
  return `forbidden ${nth} of ${ATTEMPTS} · stopped`;
}

// A small solid box on any axes, shaded by the kit's rules (four side tones by facing, a lighter
// top), so the limit-switch flag can tilt about a horizontal pivot. Self-contained: the live
// module inlines this source.

const FLAG_LEVER = 9; // lever from the pivot to the flag plate
const FLAG_PLATE = [0.6, 4.5, 6]; // half thickness, half width, half height
const FLAG_PLATE_AT = 14; // plate centre above the pivot

function camOf(P) {
  const a = ((P.azimuth ?? 45) * Math.PI) / 180;
  const e = ((P.elevation ?? 30) * Math.PI) / 180;
  return { sA: Math.sin(a), cA: Math.cos(a), sE: Math.sin(e), cE: Math.cos(e), k: P.scale * Math.sqrt(1.6) };
}
function isoOf([x, y, z], P, c) {
  return [P.origin[0] + (x * c.sA - y * c.cA) * c.k, P.origin[1] + ((x * c.cA + y * c.sA) * c.sE - z * c.cE) * c.k];
}
const tenthOf = (v) => {
  const t = (Math.round(v * 10) / 10).toFixed(1).replace(/\.0$/, "");
  return t === "-0" ? "0" : t;
};
const pathFrom = (pts, closed) => pts.map(([x, y], i) => `${i ? "L" : "M"}${tenthOf(x)} ${tenthOf(y)}`).join("") + (closed ? "Z" : "");
function hullOf(points) {
  const s = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [];
  for (const p of s) {
    while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop();
    lo.push(p);
  }
  const up = [];
  for (let i = s.length - 1; i >= 0; i--) {
    const p = s[i];
    while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop();
    up.push(p);
  }
  return [...lo.slice(0, -1), ...up.slice(0, -1)];
}

// centre c, unit axes [u, v, w], half sizes [hu, hv, hw]
function boxPaths(c, axes, half, P) {
  const cam = camOf(P);
  const view = [cam.cA * cam.cE, cam.sA * cam.cE, cam.sE];
  const light = [-cam.sA, cam.cA];
  const corner = (s) => [0, 1, 2].map((i) => c[i] + axes[0][i] * half[0] * s[0] + axes[1][i] * half[1] * s[1] + axes[2][i] * half[2] * s[2]);
  const faces = [];
  for (let i = 0; i < 3; i++) {
    for (const sign of [-1, 1]) {
      const j = (i + 1) % 3;
      const k = (i + 2) % 3;
      const quad = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => {
        const s = [0, 0, 0];
        s[i] = sign;
        s[j] = a;
        s[k] = b;
        return s;
      });
      const n = axes[i].map((v) => v * sign);
      const facing = n[0] * view[0] + n[1] * view[1] + n[2] * view[2];
      faces.push({ i, sign, quad, n, visible: facing > 1e-6 });
    }
  }
  const shades = ["", "", "", ""];
  let top = "";
  const all = [];
  for (const f of faces) {
    const pts = f.quad.map((s) => isoOf(corner(s), P, cam));
    all.push(...pts);
    if (!f.visible) continue;
    const d = pathFrom(pts, true);
    if (f.n[2] > 0.6) top += d;
    else {
      const len = Math.hypot(f.n[0], f.n[1]) || 1;
      const lit = ((f.n[0] / len) * light[0] + (f.n[1] / len) * light[1] + 1) / 2;
      shades[Math.min(3, Math.max(0, Math.floor(lit * 4)))] += d;
    }
  }
  let crease = "";
  for (let a = 0; a < faces.length; a++) {
    for (let b = a + 1; b < faces.length; b++) {
      const fa = faces[a];
      const fb = faces[b];
      if (!fa.visible || !fb.visible || fa.i === fb.i) continue;
      const k = 3 - fa.i - fb.i;
      const s0 = [0, 0, 0];
      s0[fa.i] = fa.sign;
      s0[fb.i] = fb.sign;
      s0[k] = -1;
      const s1 = s0.slice();
      s1[k] = 1;
      crease += pathFrom([isoOf(corner(s0), P, cam), isoOf(corner(s1), P, cam)]);
    }
  }
  const outline = pathFrom(hullOf(all), true);
  return { fill: outline, shades, top, crease, outline };
}

// The flag of a limit switch: a short lever up from the pivot carrying a flat plate that faces
// the travel it guards. `angle` tilts it toward +travel.
function flagSolids(sw, angle, pivotZ, P) {
  const t = sw.travel === "x" ? [1, 0, 0] : [0, 1, 0];
  const a = sw.travel === "x" ? [0, 1, 0] : [1, 0, 0];
  const s = Math.sin(angle);
  const c = Math.cos(angle);
  const up = [t[0] * s, t[1] * s, c];
  const u = [t[0] * c, t[1] * c, -s];
  const pivot = [sw.at[0], sw.at[1], pivotZ];
  const at = (h) => pivot.map((v, i) => v + up[i] * h);
  return {
    lever: boxPaths(at(FLAG_LEVER / 2 + 0.2), [u, a, up], [0.6, 0.6, FLAG_LEVER / 2 + 0.2], P),
    plate: boxPaths(at(FLAG_PLATE_AT), [u, a, up], FLAG_PLATE, P),
  };
}

// Live behaviour, inlined into faultline.live.js after the model and flag sources.
// Needs: DATA, P, the model (route, timeline, poseAt, pushOn, readoutOf, TOUR, HOVER_MOVE, HOME,
// SWITCHES, PIVOT_Z, BAYS), flagSolids, and the kit's slabOf, translateAlong, depthOf.

function setSolid(g, paths) {
  if (!g) return;
  const nodes = g.children;
  nodes[0].setAttribute("d", paths.fill);
  for (let i = 0; i < 4; i++) nodes[1 + i].setAttribute("d", paths.shades[i] || "");
  nodes[5].setAttribute("d", paths.top);
  nodes[6].setAttribute("d", paths.crease || "");
  nodes[7].setAttribute("d", paths.bevel || "");
  nodes[8].setAttribute("d", paths.outline);
}

function mount(root, { mode = "hover" } = {}) {
  const svg = root.querySelector("svg");
  const q = (name) => svg.querySelector(`[data-part="${name}"]`);
  const nodes = {
    shadow: q("shadow"),
    carriage: q("carriage"),
    beamBack: q("beam-back"),
    beamFront: q("beam-front"),
    cross: q("cross"),
    head: q("head"),
    slider: q("slider"),
    cap: q("cap"),
    switches: SWITCHES.map((sw) => ({ sw, g: q(sw.id), lever: q(`${sw.id}-lever`), flag: q(`${sw.id}-flag`), a: 0, v: 0, shown: 0 })),
  };
  const plate = root.closest(".iso-plate");
  const readout = (plate && plate.querySelector("[data-readout]")) || root.querySelector("[data-readout]");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const [RX, RY, RZ] = DATA.REST;
  const B = DATA.BEAM;

  let bay = HOME;
  let line = null;
  let t = 0;
  let tourIndex = -1;
  let fromTour = false;
  let touring = mode === "tour" && !still.matches;
  let tourWait = 1.4;
  let want = null;
  let pose = [RX, RY, RZ];
  let tag = "rest";
  let lit = SWITCHES[0].id;
  let frame = 0;
  let last = 0;
  let visible = false;
  let order = "";
  let resume = 0;
  let lastText = "";

  const say = (text) => {
    if (readout && text !== lastText) readout.textContent = text;
    lastText = text;
  };
  const userText = (ln, phase) => {
    if (!ln) return readoutOf(-1);
    if (!ln.route.stop) return phase === "set" || phase === "dwell" ? "allowed · placed" : "allowed · moving";
    return phase === "lift" || phase === "travel" ? "forbidden · moving" : "forbidden · stopped";
  };

  function start(move, viaTour) {
    line = timeline(move);
    t = 0;
    fromTour = viaTour;
    if (line.route.stop && line.route.stop.id !== lit) {
      lit = line.route.stop.id;
      for (const s of nodes.switches) {
        for (const g of [s.lever, s.flag]) {
          if (!g) continue;
          const on = s.sw.id === lit;
          if (on) g.setAttribute("data-lit", "");
          else g.removeAttribute("data-lit");
          g.lastElementChild.setAttribute("data-tone", on ? "hi" : "mid");
        }
      }
    }
  }

  function draw() {
    const [x, y, z] = pose;
    const dx = x - RX;
    const dy = y - RY;
    nodes.head && nodes.head.setAttribute("transform", translateAlong(P, [dx, dy, z - RZ]));
    nodes.shadow && nodes.shadow.setAttribute("transform", translateAlong(P, [dx, dy, 0]));
    nodes.slider && nodes.slider.setAttribute("transform", translateAlong(P, [dx, dy, 0]));
    nodes.carriage && nodes.carriage.setAttribute("transform", translateAlong(P, [dx, 0, 0]));
    nodes.cap && nodes.cap.setAttribute("transform", translateAlong(P, [dx, 0, 0]));
    setSolid(nodes.beamBack, slabOf({ x: x - 4, y: B.from, w: 8, d: y - B.slide - B.from, r: 0.8 }, B.z, B.top - B.z, P, 2, 0.4));
    setSolid(nodes.beamFront, slabOf({ x: x - 4, y: y + B.slide, w: 8, d: B.to - y - B.slide, r: 0.8 }, B.z, B.top - B.z, P, 2, 0.4));
    for (const s of nodes.switches) {
      if (Math.abs(s.a - s.shown) < 1e-4) continue;
      s.shown = s.a;
      const f = flagSolids(s.sw, s.a, PIVOT_Z, P);
      setSolid(s.lever, f.lever);
      setSolid(s.flag, f.plate);
    }
    // the head and the switches re-sort by depth as the head moves among them
    const items = [...nodes.switches.map((s) => ({ g: s.g, key: depthOf([s.sw.at[0], s.sw.at[1], 0], P) })), { g: nodes.head, key: depthOf([x, y, 0], P) }].filter((i) => i.g);
    items.sort((a, b) => a.key - b.key);
    const next = items.map((i) => i.g.getAttribute("data-part")).join(",");
    if (next !== order && nodes.cross) {
      order = next;
      const frag = document.createDocumentFragment();
      for (const i of items) frag.appendChild(i.g);
      nodes.cross.appendChild(frag);
    }
    if (touring || fromTour) say(line ? readoutOf(tourIndex, tag) : readoutOf(-1));
    else say(userText(line, tag));
  }

  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    if (!line) {
      if (touring) {
        tourWait -= dt;
        if (tourWait <= 0) {
          let i = tourIndex;
          for (let n = 0; n < TOUR.length; n++) {
            i = (i + 1) % TOUR.length;
            if (TOUR[i][0] === bay) break;
          }
          tourIndex = i;
          start(TOUR[i], true);
          tourWait = 0.25;
        }
      } else if (want && want !== bay) {
        start([bay, want], false);
        want = null;
      }
    }
    if (line) {
      t += dt;
      const p = poseAt(line, t);
      pose = p.pose;
      tag = p.tag;
      if (t >= line.total) {
        bay = line.ends;
        line = null;
        tag = "rest";
      }
    }
    let moving = !!line;
    for (const s of nodes.switches) {
      const geo = pushOn(s.sw, pose);
      s.v += (-260 * s.a - 9 * s.v) * dt;
      s.a += s.v * dt;
      if (geo !== 0 && (geo > 0 ? s.a < geo : s.a > geo)) {
        s.a = geo;
        s.v = 0;
      }
      if (geo === 0 && Math.abs(s.a) < 1e-4 && Math.abs(s.v) < 1e-3) {
        s.a = 0;
        s.v = 0;
      }
      if (s.a !== 0 || s.v !== 0) moving = true;
    }
    draw();
    const busy = moving || touring || (want && want !== bay);
    frame = visible && busy ? requestAnimationFrame(tick) : 0;
  }

  const run = () => {
    if (!frame && visible && !still.matches) {
      last = 0;
      frame = requestAnimationFrame(tick);
    }
  };
  const io = new IntersectionObserver(
    (entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (visible) run();
    },
    { rootMargin: "120px 0px" },
  );
  io.observe(root);

  const bayAt = (event) => {
    const box = svg.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    const sx = ((event.clientX - box.left) / box.width) * vb.width;
    const sy = ((event.clientY - box.top) / box.height) * vb.height;
    let best = null;
    let dist = Infinity;
    for (const [name, [bx, by]] of Object.entries(BAYS)) {
      const c = P.origin;
      const a = ((P.azimuth ?? 45) * Math.PI) / 180;
      const e = ((P.elevation ?? 30) * Math.PI) / 180;
      const kk = P.scale * Math.sqrt(1.6);
      const px = c[0] + (bx * Math.sin(a) - by * Math.cos(a)) * kk;
      const py = c[1] + ((bx * Math.cos(a) + by * Math.sin(a)) * Math.sin(e) - PAD_TOP * Math.cos(e)) * kk;
      const d = Math.hypot(px - sx, py - sy);
      if (d < dist) {
        dist = d;
        best = name;
      }
    }
    return best;
  };
  const takeOver = () => {
    touring = false;
    clearTimeout(resume);
    if (mode === "tour" && !still.matches)
      resume = setTimeout(() => {
        touring = true;
        tourWait = 0.6;
        run();
      }, 3600);
  };
  const onMove = (event) => {
    if (mode !== "tour" || still.matches) return;
    takeOver();
    want = bayAt(event);
    run();
  };
  const onEnter = () => {
    if (mode !== "hover" || still.matches || line) return;
    start(HOVER_MOVE, false);
    run();
  };
  const GRID = [["BL", "BM", "BR"], ["FL", "FM", "FR"]];
  const onKey = (event) => {
    if (still.matches) return;
    const row = GRID.findIndex((r) => r.includes(want || bay));
    const col = GRID[row].indexOf(want || bay);
    let next = null;
    if (event.key === "ArrowRight") next = GRID[row][Math.min(2, col + 1)];
    if (event.key === "ArrowLeft") next = GRID[row][Math.max(0, col - 1)];
    if (event.key === "ArrowDown") next = GRID[1][col];
    if (event.key === "ArrowUp") next = GRID[0][col];
    if (event.key === "Home") next = HOME;
    if (!next) return;
    event.preventDefault();
    takeOver();
    want = next;
    run();
  };
  root.addEventListener("pointermove", onMove);
  root.addEventListener("pointerenter", onEnter);
  root.addEventListener("keydown", onKey);
  draw();
  say(readoutOf(-1));

  return {
    destroy() {
      cancelAnimationFrame(frame);
      frame = 0;
      clearTimeout(resume);
      io.disconnect();
      root.removeEventListener("pointermove", onMove);
      root.removeEventListener("pointerenter", onEnter);
      root.removeEventListener("keydown", onKey);
    },
  };
}


mount(document.querySelector(".iso-stage"), { mode: "tour" });
</script></body></html>
